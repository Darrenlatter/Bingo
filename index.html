<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Caller Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #4e9af1;
            margin-bottom: 5px;
        }

        .instructions {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .controls {
            margin-bottom: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin: 0 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-draw {
            background-color: #4e9af1;
            color: #fff;
        }

        .btn-draw:hover {
            background-color: #357ae8;
        }

        .btn-reset {
            background-color: #e05d5d;
            color: #fff;
        }

        .btn-reset:hover {
            background-color: #c94444;
        }

        /* Master Board Grid Styling */
        .master-board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 8px;
            max-width: 900px;
            background: #2a2a40;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .cell {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #151522;
            border: 1px solid #3d3d5c;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #555;
            transition: background-color 0.3s, color 0.3s, transform 0.2s;
        }

        /* Visual highlighting for called numbers */
        .cell.called {
            background: radial-gradient(circle at 30% 30%, #4e9af1, #1f64b8);
            color: #fff;
            border-color: #4e9af1;
            box-shadow: 0 0 8px rgba(78, 154, 241, 0.5);
            transform: scale(1.05);
        }

        .current-display {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            height: 80px;
        }
    </style>
</head>
<body>

    <h1>Bingo Caller Dashboard</h1>
    <div class="instructions">Keep this window open. Open <strong>display.html</strong> in a separate tab or screen to show your audience.</div>

    <div class="current-display" id="currentDisplay">--</div>

    <div class="controls">
        <button class="btn-draw" id="drawBtn">Draw Next Ball</button>
        <button class="btn-reset" id="resetBtn">Reset Game</button>
    </div>

    <div class="master-board" id="masterBoard"></div>

    <script>
        const TOTAL_BALLS = 75;
        let calledBalls = [];
        
        const currentDisplay = document.getElementById('currentDisplay');
        const masterBoard = document.getElementById('masterBoard');
        const drawBtn = document.getElementById('drawBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Initialize the 1-75 master board UI elements
        function initBoard() {
            masterBoard.innerHTML = '';
            for (let i = 1; i <= TOTAL_BALLS; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                cell.textContent = i;
                masterBoard.appendChild(cell);
            }
        }

        // Draw a random number that hasn't been drawn yet
        function drawBall() {
            if (calledBalls.length >= TOTAL_BALLS) {
                alert('All numbers have been drawn!');
                return;
            }

            let randomNumber;
            do {
                randomNumber = Math.floor(Math.random() * TOTAL_BALLS) + 1;
            } while (calledBalls.includes(randomNumber));

            // Track the ball
            calledBalls.push(randomNumber);
            
            // Sync to localStorage for display.html to read immediately
            localStorage.setItem('bingoCalledBalls', JSON.stringify(calledBalls));

            // Update local UI
            updateUI(randomNumber);
        }

        // Update UI components when a number is drawn
        function updateUI(latestNumber) {
            currentDisplay.textContent = latestNumber;
            
            const cell = document.getElementById(`cell-${latestNumber}`);
            if (cell) {
                cell.classList.add('called');
            }
        }

        // Reset game state entirely
        function resetGame() {
            if (confirm('Are you sure you want to reset the current game?')) {
                calledBalls = [];
                localStorage.setItem('bingoCalledBalls', JSON.stringify(calledBalls));
                currentDisplay.textContent = '--';
                
                // Remove 'called' classes from grid cells
                const cells = document.querySelectorAll('.cell');
                cells.forEach(cell => cell.classList.remove('called'));
            }
        }

        // Restore game if page is reloaded halfway through
        function loadSavedState() {
            const saved = localStorage.getItem('bingoCalledBalls');
            if (saved) {
                calledBalls = JSON.parse(saved);
                calledBalls.forEach(num => {
                    const cell = document.getElementById(`cell-${num}`);
                    if (cell) cell.classList.add('called');
                });
                
                if (calledBalls.length > 0) {
                    currentDisplay.textContent = calledBalls[calledBalls.length - 1];
                }
            }
        }

        // Event Listeners
        drawBtn.addEventListener('click', drawBall);
        resetBtn.addEventListener('click', resetGame);

        // Run on startup
        initBoard();
        loadSavedState();
    </script>
</body>
</html>
