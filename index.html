<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Caller Dashboard & Checker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #4e9af1;
            margin-bottom: 5px;
        }

        .instructions {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 25px;
            text-align: center;
        }

        .main-layout {
            display: flex;
            flex-direction: row;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        .caller-side {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .checker-side {
            background: #252538;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 320px;
        }

        .controls {
            margin-bottom: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin: 0 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-draw {
            background-color: #4e9af1;
            color: #fff;
        }

        .btn-draw:hover {
            background-color: #357ae8;
        }

        .btn-reset {
            background-color: #e05d5d;
            color: #fff;
        }

        .btn-reset:hover {
            background-color: #c94444;
        }

        .btn-check {
            background-color: #00ffcc;
            color: #1e1e2f;
            width: 100%;
            margin: 10px 0 0 0;
        }

        .btn-check:hover {
            background-color: #00ccaa;
        }

        /* Master Board Grid Styling */
        .master-board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 8px;
            max-width: 750px;
            background: #2a2a40;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #151522;
            border: 1px solid #3d3d5c;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            color: #555;
            transition: background-color 0.3s, color 0.3s, transform 0.2s;
        }

        .cell.called {
            background: radial-gradient(circle at 30% 30%, #4e9af1, #1f64b8);
            color: #fff;
            border-color: #4e9af1;
            box-shadow: 0 0 8px rgba(78, 154, 241, 0.5);
            transform: scale(1.05);
        }

        .current-display {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            height: 80px;
        }

        /* Checker styling */
        h2 {
            margin-top: 0;
            color: #00ffcc;
            font-size: 1.4rem;
            border-bottom: 1px solid #3d3d5c;
            padding-bottom: 10px;
        }

        .checker-row {
            margin-bottom: 15px;
        }

        .checker-row label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .checker-row input {
            width: 100%;
            padding: 10px;
            background: #151522;
            border: 1px solid #3d3d5c;
            color: #fff;
            border-radius: 4px;
            font-size: 1.1rem;
            box-sizing: border-box;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .status-win {
            background-color: #28a745;
            color: white;
        }

        .status-fail {
            background-color: #dc3545;
            color: white;
        }

        @media (max-width: 900px) {
            .main-layout {
                flex-direction: column;
                align-items: center;
            }
            .master-board {
                grid-template-columns: repeat(10, 1fr);
            }
        }
    </style>
</head>
<body>

    <h1>Bingo Caller Dashboard</h1>
    <div class="instructions">Keep this window open to run the game. Open <strong>display.html</strong> in another window to show your audience.</div>

    <div class="main-layout">
        
        <div class="caller-side">
            <div class="current-display" id="currentDisplay">--</div>

            <div class="controls">
                <button class="btn-draw" id="drawBtn">Draw Next Ball</button>
                <button class="btn-reset" id="resetBtn">Reset Game</button>
            </div>

            <div class="master-board" id="masterBoard"></div>
        </div>

        <div class="checker-side">
            <h2>Ticket Checker</h2>
            <p style="font-size: 0.85rem; color: #aaa; margin-top: -5px;">Input the claimant's ticket grid to verify wins.</p>
            
            <div class="checker-row">
                <label>Row 1 Numbers (Comma separated)</label>
                <input type="text" id="row1" placeholder="e.g. 5, 12, 24, 45, 61">
            </div>
            <div class="checker-row">
                <label>Row 2 Numbers (Comma separated)</label>
                <input type="text" id="row2" placeholder="e.g. 2, 19, 33, 52, 70">
            </div>
            <div class="checker-row">
                <label>Row 3 Numbers (Comma separated)</label>
                <input type="text" id="row3" placeholder="e.g. 9, 21, 40, 58, 75">
            </div>

            <button class="btn-check" id="checkBtn">Verify Ticket Status</button>

            <div id="resultBox" class="result-box"></div>
        </div>

    </div>

    <script>
        const TOTAL_BALLS = 75;
        let calledBalls = [];
        let gameStatus = { oneLineWon: false, twoLinesWon: false, bingoWon: false };
        
        const currentDisplay = document.getElementById('currentDisplay');
        const masterBoard = document.getElementById('masterBoard');
        const drawBtn = document.getElementById('drawBtn');
        const resetBtn = document.getElementById('resetBtn');
        const checkBtn = document.getElementById('checkBtn');
        const resultBox = document.getElementById('resultBox');

        function initBoard() {
            masterBoard.innerHTML = '';
            for (let i = 1; i <= TOTAL_BALLS; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                cell.textContent = i;
                masterBoard.appendChild(cell);
            }
        }

        function drawBall() {
            if (calledBalls.length >= TOTAL_BALLS) {
                alert('All numbers have been drawn!');
                return;
            }

            let randomNumber;
            do {
                randomNumber = Math.floor(Math.random() * TOTAL_BALLS) + 1;
            } while (calledBalls.includes(randomNumber));

            calledBalls.push(randomNumber);
            localStorage.setItem('bingoCalledBalls', JSON.stringify(calledBalls));

            updateUI(randomNumber);
        }

        function updateUI(latestNumber) {
            currentDisplay.textContent = latestNumber;
            const cell = document.getElementById(`cell-${latestNumber}`);
            if (cell) {
                cell.classList.add('called');
            }
        }

        function resetGame() {
            if (confirm('Are you sure you want to reset the current game?')) {
                calledBalls = [];
                gameStatus = { oneLineWon: false, twoLinesWon: false, bingoWon: false };
                
                localStorage.setItem('bingoCalledBalls', JSON.stringify(calledBalls));
                localStorage.setItem('bingoGameStatus', JSON.stringify(gameStatus));
                
                currentDisplay.textContent = '--';
                
                const cells = document.querySelectorAll('.cell');
                cells.forEach(cell => cell.classList.remove('called'));
                
                resultBox.style.display = 'none';
                document.getElementById('row1').value = '';
                document.getElementById('row2').value = '';
                document.getElementById('row3').value = '';
            }
        }

        function loadSavedState() {
            const savedBalls = localStorage.getItem('bingoCalledBalls');
            if (savedBalls) {
                calledBalls = JSON.parse(savedBalls);
                calledBalls.forEach(num => {
                    const cell = document.getElementById(`cell-${num}`);
                    if (cell) cell.classList.add('called');
                });
                if (calledBalls.length > 0) {
                    currentDisplay.textContent = calledBalls[calledBalls.length - 1];
                }
            }

            const savedStatus = localStorage.getItem('bingoGameStatus');
            if (savedStatus) {
                gameStatus = JSON.parse(savedStatus);
            }
        }

        // Parse row entries and discard duplicates using ES6 Sets
        function parseRowInput(inputId) {
            const val = document.getElementById(inputId).value;
            if (!val.trim()) return [];
            
            const rawNumbers = val.split(',')
                                 .map(num => parseInt(num.trim(), 10))
                                 .filter(num => !isNaN(num) && num > 0 && num <= TOTAL_BALLS);
            
            // Using Set automatically removes duplicates
            return [...new Set(rawNumbers)];
        }

        function verifyTicket() {
            const r1 = parseRowInput('row1');
            const r2 = parseRowInput('row2');
            const r3 = parseRowInput('row3');

            if (r1.length === 0 && r2.length === 0 && r3.length === 0) {
                showResult('Please enter numbers to check.', false);
                return;
            }

            const r1Matches = r1.filter(num => calledBalls.includes(num)).length;
            const r2Matches = r2.filter(num => calledBalls.includes(num)).length;
            const r3Matches = r3.filter(num => calledBalls.includes(num)).length;

            const r1Cleared = r1.length > 0 && r1Matches === r1.length;
            const r2Cleared = r2.length > 0 && r2Matches === r2.length;
            const r3Cleared = r3.length > 0 && r3Matches === r3.length;

            let completedLinesCount = 0;
            if (r1Cleared) completedLinesCount++;
            if (r2Cleared) completedLinesCount++;
            if (r3Cleared) completedLinesCount++;

            if (completedLinesCount === 3) {
                gameStatus.bingoWon = true;
                localStorage.setItem('bingoGameStatus', JSON.stringify(gameStatus));
                showResult('🎉 BINGO WINNER! (Full House Cleared)', true);
            } else if (completedLinesCount === 2) {
                gameStatus.twoLinesWon = true;
                localStorage.setItem('bingoGameStatus', JSON.stringify(gameStatus));
                showResult('🥈 TWO LINES CLEARED!', true);
            } else if (completedLinesCount === 1) {
                gameStatus.oneLineWon = true;
                localStorage.setItem('bingoGameStatus', JSON.stringify(gameStatus));
                showResult('🥇 ONE LINE CLEARED!', true);
            } else {
                let feedback = '❌ No New Winning Lines.\n';
                if (r1.length > 0) feedback += `Row 1: ${r1Matches}/${r1.length} | `;
                if (r2.length > 0) feedback += `Row 2: ${r2Matches}/${r2.length} | `;
                if (r3.length > 0) feedback += `Row 3: ${r3Matches}/${r3.length}`;
                showResult(feedback, false);
            }
        }

        function showResult(message, isWin) {
            resultBox.innerText = message;
            resultBox.style.display = 'block';
            resultBox.className = 'result-box ' + (isWin ? 'status-win' : 'status-fail');
        }

        drawBtn.addEventListener('click', drawBall);
        resetBtn.addEventListener('click', resetGame);
        checkBtn.addEventListener('click', verifyTicket);

        initBoard();
        loadSavedState();
    </script>
</body>
</html>
