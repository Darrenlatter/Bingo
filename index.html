<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK 90-Ball Bingo Caller Dashboard (Remote Hub)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: #4e9af1;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .instructions {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Fixed Split-Screen Layout Structure */
        .main-layout {
            display: flex;
            flex-direction: row;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            align-items: flex-start;
        }

        /* LEFT SIDE: Active Controllers */
        .left-controls-side {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 340px;
            flex-shrink: 0;
        }

        .caller-card, .checker-card {
            background: #252538;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .caller-card { text-align: center; }

        /* RIGHT SIDE: 90-Ball Matrix Board Container */
        .right-grid-side {
            background: #2a2a40;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            flex-grow: 1;
            max-width: 620px;
            box-sizing: border-box;
        }

        /* 10-Column Board Grid Setup */
        .master-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            width: 100%;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #151522;
            border: 1px solid #3d3d5c;
            border-radius: 6px;
            font-size: 1.15rem;
            font-weight: bold;
            color: #44445c;
            transition: background-color 0.3s, color 0.3s, transform 0.2s;
        }

        .cell.called {
            background: radial-gradient(circle at 30% 30%, #4e9af1, #1f64b8);
            color: #fff;
            border-color: #4e9af1;
            box-shadow: 0 0 8px rgba(78, 154, 241, 0.5);
            transform: scale(1.05);
        }
