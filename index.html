<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK 90-Ball Bingo Caller Dashboard (Remote Hub)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: #4e9af1;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .instructions {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 25px;
            text-align: center;
        }

        .main-layout {
            display: flex;
            flex-direction: row;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            align-items: flex-start;
        }

        .left-controls-side {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 340px;
            flex-shrink: 0;
        }

        .caller-card, .checker-card {
            background: #252538;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .caller-card { text-align: center; }

        .right-grid-side {
            background: #2a2a40;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            flex-grow: 1;
            max-width: 620px;
            box-sizing: border-box;
        }

        .master-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            width: 100%;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #151522;
            border: 1px solid #3d3d5c;
            border-radius: 6px;
            font-size: 1.15rem;
            font-weight: bold;
            color: #44445c;
            transition: background-color 0.3s, color 0.3s, transform 0.2s;
        }

        .cell.called {
            background: radial-gradient(circle at 30% 30%, #4e9af1, #1f64b8);
            color: #fff;
            border-color: #4e9af1;
            box-shadow: 0 0 8px rgba(78, 154, 241, 0.5);
            transform: scale(1.05);
        }

        .current-display {
            font-size: 5rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            height: 100px;
            line-height: 100px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active { transform: scale(0.98); }
        .btn-draw { background-color: #4e9af1; color: #fff; }
        .btn-draw:hover { background-color: #357ae8; }
        .btn-reset { background-color: #e05d5d; color: #fff; }
        .btn-reset:hover { background-color: #c94444; }
        .btn-check { background-color: #00ffcc; color: #1e1e2f; width: 100%; margin-top: 10px; }
        .btn-check:hover { background-color: #00ccaa; }

        h2 { margin-top: 0; color: #00ffcc; font-size: 1.4rem
