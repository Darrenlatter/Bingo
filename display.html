<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo - Live Audience Display</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #4e9af1;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .showcase-layout {
            display: flex;
            flex-direction: row;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            justify-content: center;
            align-items: flex-start;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Prize Management Sidebar */
        .status-panel {
            background-color: #161625;
            padding: 20px;
            border-radius: 10px;
            width: 280px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: left;
        }

        .status-panel h3 {
            margin-top: 0;
            color: #00ffcc;
            border-bottom: 1px solid #3d3d5c;
            padding-bottom: 8px;
        }

        .badge {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
            background-color: #222235;
            color: #555570;
            text-align: center;
            transition: all 0.4s ease;
        }

        .badge.active {
            color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .badge.one-line.active { background-color: #ff9f43; }
        .badge.two-lines.active { background-color: #0abde3; }
        .badge.bingo.active { background-color: #10ac84; animation: flash 1s infinite alternate; }

        .latest-container {
            margin-bottom: 25px;
        }

        .latest-ball {
            display: inline-block;
            width: 140px;
            height: 140px;
            line-height: 140px;
            background: radial-gradient(circle at 30% 30%, #4e9af1, #1f64b8);
            color: white;
            font-size: 4.5rem;
            font-weight: bold;
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            animation: popIn 0.3s ease-out;
        }

        /* 10-Column Board Grid Container */
        .board-container {
            background-color: #161625;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .master-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            max-width: 750px;
        }

        .cell {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0f0f1a;
            border: 1px solid #2d2d44;
            border-radius: 4px;
            font-size: 1.05rem;
            font-weight: bold;
            color: #333344;
            transition: all 0.3s ease;
        }

        .cell.called {
            background: radial-gradient(circle at 30% 30%, #4e9af1, #1f64b8);
            color: #fff;
            border-color: #4e9af1;
            box-shadow: 0 0 8px rgba(78, 154, 241, 0.4);
            transform: scale(1.02);
        }

        .conn-status {
            font-size: 0.85rem;
            color: #ff4757;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .conn-status.connected { color: #2ed573; }

        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes flash { from { box-shadow: 0 0 5px #10ac84; } to { box-shadow: 0 0 20px #10ac84; } }

        @media (max-width: 950px) {
            .showcase-layout { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <h1>BINGO MAIN BOARD</h1>
    <div id="connStatus" class="conn-status">📡 Connecting to Live Channel...</div>

    <div class="showcase-layout">
        
        <div class="left-panel">
            <div class="latest-container">
                <div id="latestBallSlot"></div>
            </div>

            <div class="status-panel">
                <h3>Prizes Status</h3>
                <div id="badgeLine1" class="badge one-line">🥇 1 LINE</div>
                <div id="badgeLine2" class="badge two-lines">🥈 2 LINES</div>
                <div id="badgeBingo" class="badge bingo">🏆 FULL HOUSE / BINGO</div>
            </div>
        </div>

        <div class="board-container">
            <div class="master-board" id="displayBoardGrid"></div>
        </div>

    </div>

    <script>
        // Injected project variables matching dashboard channel identifiers
        const SUPABASE_URL = "https://vwcownlgofzzfnveukwe.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3Y293bmxnb2Z6emZudmV1a3dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2ODM0NjUsImV4cCI6MjA5NjI1OTQ2NX0.uRJHGyXxxEKgxnZyWrb3q-0nmxkkxYIRdV94lE-4Dpw";

        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const channel = supabase.channel('bingo-global-room');

        const TOTAL_BALLS = 90;
        const displayBoardGrid = document.getElementById('displayBoardGrid');
        const latestBallSlot = document.getElementById('latestBallSlot');
        const connStatus = document.getElementById('connStatus');
        
        const badgeLine1 = document.getElementById('badgeLine1');
        const badgeLine2 = document.getElementById('badgeLine2');
        const badgeBingo = document.getElementById('badgeBingo');

        function buildGridUI() {
            displayBoardGrid.innerHTML = '';
            for (let i = 1; i <= TOTAL_BALLS; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `view-cell-${i}`;
                cell.textContent = i;
                displayBoardGrid.appendChild(cell);
            }
        }

        function applySyncedState(calledBalls, gameStatus) {
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('called'));
            calledBalls.forEach(num => {
                const cell = document.getElementById(`view-cell-${num}`);
                if (cell) cell.classList.add('called');
            });

            if (calledBalls.length > 0) {
                const lastBall = calledBalls[calledBalls.length - 1];
                latestBallSlot.innerHTML = `<div class="latest-ball">${lastBall}</div>`;
            } else {
                latestBallSlot.innerHTML = '<div style="height:140px; display:flex; align-items:center; color:#444;">Ready</div>';
            }

            if (gameStatus.oneLineWon) badgeLine1.classList.add('active'); else badgeLine1.classList.remove('active');
            if (gameStatus.twoLinesWon) badgeLine2.classList.add('active'); else badgeLine2.classList.remove('active');
            if (gameStatus.bingoWon) badgeBingo.classList.add('active'); else badgeBingo.classList.remove('active');
        }

        channel
            .on('broadcast', { event: 'sync' }, ({ payload }) => {
                applySyncedState(payload.calledBalls, payload.gameStatus);
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    connStatus.textContent = "🟢 Connected • Live Global Link Active";
                    connStatus.className = "conn-status connected";
                }
            });

        buildGridUI();
    </script>
</body>
</html>
