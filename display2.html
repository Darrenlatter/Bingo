<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo - UK Theatre Display Board</title>
    <style>
        :root {
            --bg-main: #0b0c10;
            --bg-card: #1f2833;
            --accent-glow: #66fcf1;
            --text-bright: #ffffff;
            --text-muted: #c5c6c7;
            --cell-empty: #12161c;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-bright);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            border-bottom: 2px solid var(--bg-card);
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .prizes-ticker {
            display: flex;
            gap: 15px;
        }

        .prize-banner {
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.95rem;
            background: #11141a;
            border: 1px solid #222b35;
            color: #445060;
            transition: all 0.4s ease;
        }

        .prize-banner.active {
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .prize-banner.p1.active { background: linear-gradient(135deg, #ff9f43, #ffca28); }
        .prize-banner.p2.active { background: linear-gradient(135deg, #0abde3, #4ea5ff); }
        .prize-banner.p3.active { background: linear-gradient(135deg, #10ac84, #1dd1a1); animation: heartbeat 1.5s infinite; }

        .theater-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
            flex: 1;
            min-height: 0;
        }

        /* Left Side Panels */
        .focus-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-ball-box {
            background: var(--bg-card);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2f3b4c;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero-label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-glow);
            margin-bottom: 15px;
        }

        .giant-ball {
            width: 170px;
            height: 170px;
            line-height: 170px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, var(--accent-glow) 50%, #005f5f 100%);
            color: #051c1c;
            font-size: 6rem;
            font-weight: 900;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(102, 252, 241, 0.3);
            animation: ballPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .history-reel-box {
            background: #11141a;
            border-radius: 16px;
            padding: 15px;
            border: 1px solid #1f2631;
        }

        .reel-slots {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
        }

        .reel-ball {
            width: 50px;
            height: 50px;
            line-height: 50px;
            background: #222831;
            color: var(--text-bright);
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50%;
            text-align: center;
            border: 1px solid #475569;
        }

        /* Right Side: Traditional UK 9-Column Board Vertical Layout */
        .grid-panel {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2f3b4c;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 10px;
        }

        .uk-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .col-header {
            text-align: center;
            font-size: 0.8rem;
            color: var(--accent-glow);
            font-weight: bold;
            padding-bottom: 5px;
            border-bottom: 1px solid #2f3b4c;
            margin-bottom: 4px;
        }

        .cell {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--cell-empty);
            border-radius: 6px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #242c37;
            border: 1px solid #1b222b;
            transition: all 0.3s ease;
        }

        .cell.called {
            background: radial-gradient(circle at 30% 30%, #203a43, #0f2027);
            color: var(--accent-glow);
            border-color: var(--accent-glow);
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
        }

        @keyframes ballPop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 900px) {
            .theater-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>UK 90-BALL BINGO</h1>
        <div class="prizes-ticker">
            <div id="p1" class="prize-banner p1">🥇 1 LINE</div>
            <div id="p2" class="prize-banner p2">🥈 2 LINES</div>
            <div id="p3" class="prize-banner p3">🏆 FULL HOUSE</div>
        </div>
    </header>

    <div class="theater-container">
        
        <div class="focus-panel">
            <div class="hero-ball-box">
                <div id="heroLabel" class="hero-label"></div>
                <div id="giantBallSlot"><div style="color:#4f5e71;">Waiting...</div></div>
            </div>

            <div class="history-reel-box">
                <div style="font-size:0.8rem; text-transform:uppercase; color:var(--text-muted);">Previous</div>
                <div class="reel-slots" id="historyReel"></div>
            </div>
        </div>

        <div class="grid-panel" id="ukGridBoard"></div>

    </div>

    <script>
        const TOTAL_BALLS = 90;
        const ukGridBoard = document.getElementById('ukGridBoard');
        const giantBallSlot = document.getElementById('giantBallSlot');
        const heroLabel = document.getElementById('heroLabel');
        const historyReel = document.getElementById('historyReel');

        // Layout numbers into columns matching standard UK ticket index boundaries
        function buildUKGrid() {
            ukGridBoard.innerHTML = '';
            
            const columns = [
                { label: '1-9', min: 1, max: 9 },
                { label: '10-19', min: 10, max: 19 },
                { label: '20-29', min: 20, max: 29 },
                { label: '30-39', min: 30, max: 39 },
                { label: '40-49', min: 40, max: 49 },
                { label: '50-59', min: 50, max: 59 },
                { label: '60-69', min: 60, max: 69 },
                { label: '70-79', min: 70, max: 79 },
                { label: '80-90', min: 80, max: 90 }
            ];

            columns.forEach(col => {
                const colDiv = document.createElement('div');
                colDiv.className = 'uk-column';

                const header = document.createElement('div');
                header.className = 'col-header';
                header.textContent = col.label;
                colDiv.appendChild(header);

                for (let i = col.min; i <= col.max; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `uk-cell-${i}`;
                    cell.textContent = i;
                    colDiv.appendChild(cell);
                }
                
                // Add blank layout fill spacers to make columns with fewer numbers match heights smoothly
                if(col.max - col.min < 10) {
                    const spacer = document.createElement('div');
                    spacer.className = 'cell';
                    spacer.style.visibility = 'hidden';
                    colDiv.appendChild(spacer);
                }

                ukGridBoard.appendChild(colDiv);
            });
        }

        function syncDisplay() {
            const ballData = localStorage.getItem('bingoCalledBalls');
            const calledBalls = ballData ? JSON.parse(ballData) : [];

            document.querySelectorAll('.cell').forEach(c => c.classList.remove('called'));
            calledBalls.forEach(num => {
                const cell = document.getElementById(`uk-cell-${num}`);
                if (cell) cell.classList.add('called');
            });

            if (calledBalls.length > 0) {
                const active = calledBalls[calledBalls.length - 1];
                heroLabel.textContent = "Last Ball";
                giantBallSlot.innerHTML = `<div class="giant-ball">${active}</div>`;
            } else {
                heroLabel.textContent = "";
                giantBallSlot.innerHTML = '<div style="color:#4f5e71;">Waiting...</div>';
            }

            if (calledBalls.length > 1) {
                historyReel.innerHTML = '';
                calledBalls.slice(0, -1).reverse().slice(0, 3).forEach(num => {
                    const b = document.createElement('div');
                    b.className = 'reel-ball';
                    b.textContent = num;
                    historyReel.appendChild(b);
                });
            } else {
                historyReel.innerHTML = '<div style="color:#2c3540; font-size:0.9rem;">None</div>';
            }

            const statusData = localStorage.getItem('bingoGameStatus');
            const gameStatus = statusData ? JSON.parse(statusData) : { oneLineWon: false, twoLinesWon: false, bingoWon: false };

            document.getElementById('p1').classList.toggle('active', gameStatus.oneLineWon);
            document.getElementById('p2').classList.toggle('active', gameStatus.twoLinesWon);
            document.getElementById('p3').classList.toggle('active', gameStatus.bingoWon);
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'bingoCalledBalls' || e.key === 'bingoGameStatus') syncDisplay();
        });

        buildUKGrid();
        syncDisplay();
    </script>
</body>
</html>
