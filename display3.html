<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo — Live Display Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1a2e;
  --bg2: #161625;
  --accent: #e94560;
  --accent-dark: #950740;
  --ball-bg: #0f3460;
  --text: #fff;
  --muted: #888;
  --border: #2d2d44;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 24px 20px;
  text-align: center;
  min-height: 100vh;
}
h1 {
  font-family: 'Bebas Neue', sans-serif;
  color: var(--accent);
  font-size: 3rem;
  letter-spacing: 4px;
  margin-bottom: 4px;
}
.sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 10px; }

.conn-pill {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 0.78rem; padding: 4px 12px; border-radius: 20px;
  background: var(--bg2); border: 1px solid var(--border); margin-bottom: 20px;
}
.conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; transition: background 0.4s; }
.conn-dot.online { background: #e94560; box-shadow: 0 0 6px #e94560; }
.conn-dot.offline { background: #777; }

/* Prize banners */
.prizes-row {
  display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap;
}
.prize-banner {
  padding: 8px 18px; border-radius: 30px;
  font-weight: 800; font-size: 0.88rem;
  background: #11111f; border: 1px solid var(--border); color: #444460;
  transition: all 0.4s ease;
}
.prize-banner.active { color: #fff; }
.prize-banner.p1.active { background: linear-gradient(135deg, #ff9f43, #e67e22); box-shadow: 0 0 14px rgba(255,159,67,0.4); }
.prize-banner.p2.active { background: linear-gradient(135deg, #0abde3, #2c6fad); box-shadow: 0 0 14px rgba(10,189,227,0.4); }
.prize-banner.p3.active { background: linear-gradient(135deg, #e94560, #950740); box-shadow: 0 0 14px rgba(233,69,96,0.5); animation: pulse 1.5s infinite; }

/* Latest ball section */
.top-section {
  display: flex; gap: 28px; justify-content: center;
  align-items: center; margin-bottom: 30px; flex-wrap: wrap;
}
.ball-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.ball-label {
  font-size: 0.72rem; text-transform: uppercase;
  letter-spacing: 2px; color: var(--muted);
}
.latest-ball {
  display: inline-flex; align-items: center; justify-content: center;
  width: 150px; height: 150px;
  background: radial-gradient(circle at 30% 30%, var(--accent), var(--accent-dark));
  color: #fff; font-family: 'Bebas Neue', sans-serif;
  font-size: 5.5rem; letter-spacing: 2px; border-radius: 50%;
  box-shadow: 0 10px 28px rgba(233,69,96,0.4);
  animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.ready-placeholder {
  width: 150px; height: 150px;
  border: 2px dashed var(--border); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #444; font-size: 0.9rem;
}

/* History reel */
.reel-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.reel-slots { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.reel-ball {
  width: 52px; height: 52px; line-height: 52px;
  background: linear-gradient(145deg, var(--ball-bg), #162447);
  color: #fff; font-size: 1.3rem; font-weight: 700;
  border-radius: 50%; text-align: center;
  border: 2px solid var(--ball-bg);
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
}
.drawn-badge {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 14px;
  font-size: 0.8rem; color: var(--muted);
}
.drawn-badge span { color: var(--accent); font-weight: 700; }

/* Grid of all balls */
.board-container {
  max-width: 900px; margin: 0 auto;
  background: var(--bg2); padding: 20px;
  border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  border: 1px solid var(--border);
}
.board-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem;
  letter-spacing: 2px; color: var(--muted);
  margin-bottom: 16px; text-align: left;
}
.balls-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 10px;
}
.grid-ball {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, var(--ball-bg), #162447);
  color: #1a2a40; font-size: 1.1rem; font-weight: 700;
  border-radius: 50%; border: 2px solid #0f2550;
  transition: all 0.28s ease;
}
.grid-ball.called {
  color: #fff;
  box-shadow: 0 0 10px rgba(233,69,96,0.45);
  border-color: var(--accent);
  background: radial-gradient(circle at 30% 30%, var(--accent), var(--accent-dark));
  transform: scale(1.06);
}

@keyframes popIn {
  0% { transform: scale(0.4); opacity: 0; }
  80% { transform: scale(1.08); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 8px rgba(233,69,96,0.5); }
  50% { box-shadow: 0 0 22px rgba(233,69,96,0.8); }
}
@media (max-width: 600px) {
  .top-section { flex-direction: column; }
  .balls-grid { grid-template-columns: repeat(9, 1fr); }
}
</style>
</head>
<body>

<h1>BINGO LIVE DISPLAY</h1>
<p class="sub">Live game board — updates in real time</p>

<div class="conn-pill">
  <div class="conn-dot" id="connDot"></div>
  <span id="connLabel">Connecting...</span>
</div>

<div class="prizes-row">
  <div id="p1" class="prize-banner p1">🥇 1 LINE</div>
  <div id="p2" class="prize-banner p2">🥈 2 LINES</div>
  <div id="p3" class="prize-banner p3">🏆 FULL HOUSE</div>
</div>

<div class="top-section">
  <div class="ball-col">
    <div class="ball-label">Latest Ball</div>
    <div id="latestBallSlot">
      <div class="ready-placeholder">Ready</div>
    </div>
  </div>

  <div class="reel-col">
    <div class="ball-label">Previous 5</div>
    <div class="reel-slots" id="historyReel">
      <span style="color:#444; font-size:0.85rem;">None yet</span>
    </div>
    <div class="drawn-badge">Drawn: <span id="drawnCount">0</span> / 90</div>
  </div>
</div>

<div class="board-container">
  <div class="board-title">ALL BALLS — 1 TO 90</div>
  <div class="balls-grid" id="ballsGrid"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ============================================================
// 🔧 REPLACE with your Firebase project config (same as index.html)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyA44GicpEIjrO0HhzbItABAXJ1gj_jCmO4",
  authDomain: "bingo-b7631.firebaseapp.com",
  databaseURL: "https://bingo-b7631-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bingo-b7631",
  storageBucket: "bingo-b7631.firebasestorage.app",
  messagingSenderId: "807313017887",
  appId: "1:807313017887:web:8b2129aec19ca82289d92a"
};
// ============================================================

const TOTAL = 90;

function buildGrid() {
  const grid = document.getElementById('ballsGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'grid-ball';
    d.id = `gb-${i}`;
    d.textContent = i;
    grid.appendChild(d);
  }
}

function render(calledBalls, gameStatus) {
  for (let i = 1; i <= TOTAL; i++) {
    const el = document.getElementById(`gb-${i}`);
    if (el) el.classList.toggle('called', calledBalls.includes(i));
  }

  // Latest ball
  const slot = document.getElementById('latestBallSlot');
  if (calledBalls.length > 0) {
    slot.innerHTML = `<div class="latest-ball">${calledBalls[calledBalls.length - 1]}</div>`;
  } else {
    slot.innerHTML = '<div class="ready-placeholder">Ready</div>';
  }

  // History reel
  const reel = document.getElementById('historyReel');
  const prev = [...calledBalls].slice(0, -1).reverse().slice(0, 5);
  if (prev.length === 0) {
    reel.innerHTML = '<span style="color:#444; font-size:0.85rem;">None yet</span>';
  } else {
    reel.innerHTML = '';
    prev.forEach(n => {
      const b = document.createElement('div');
      b.className = 'reel-ball';
      b.textContent = n;
      reel.appendChild(b);
    });
  }

  // Drawn count
  document.getElementById('drawnCount').textContent = calledBalls.length;

  // Prizes
  const gs = { oneLineWon: false, twoLinesWon: false, bingoWon: false, ...gameStatus };
  document.getElementById('p1').classList.toggle('active', gs.oneLineWon);
  document.getElementById('p2').classList.toggle('active', gs.twoLinesWon);
  document.getElementById('p3').classList.toggle('active', gs.bingoWon);
}

function loadLocal() {
  try {
    const b = JSON.parse(localStorage.getItem('bingoCalledBalls') || '[]');
    const s = JSON.parse(localStorage.getItem('bingoGameStatus') || '{}');
    render(b, s);
  } catch(e) { render([], {}); }
}

try {
  const app = initializeApp(firebaseConfig);
  if (true) { // Firebase configured
    const db = getDatabase(app);
    document.getElementById('connDot').className = 'conn-dot online';
    document.getElementById('connLabel').textContent = 'Live — Firebase sync active';
    let balls = [], status = {};
    onValue(ref(db, 'bingo/calledBalls'), snap => { balls = snap.val() || []; render(balls, status); });
    onValue(ref(db, 'bingo/gameStatus'), snap => { status = snap.val() || {}; render(balls, status); });
  } else { throw new Error('placeholder'); }
} catch(e) {
  document.getElementById('connDot').className = 'conn-dot offline';
  document.getElementById('connLabel').textContent = 'Local only — configure Firebase for cross-device sync';
  loadLocal();
  window.addEventListener('storage', ev => {
    if (ev.key === 'bingoCalledBalls' || ev.key === 'bingoGameStatus') loadLocal();
  });
}

buildGrid();
</script>
</body>
</html>
